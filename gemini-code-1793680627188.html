<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaStream - Videos Cortos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Encabezado / Navbar -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-black text-red-500 tracking-wider">ZetaStream 🎬</h1>
        <span class="text-xs bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-medium">Clips Cortos</span>
      </div>

      <div class="w-full sm:w-72">
        <input type="text" id="search-input" placeholder="Buscar clip o título..." 
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-red-500 transition">
      </div>

      <div class="flex items-center gap-3">
        <a href="https://shadowscans01.github.io/zetamods/" target="_blank" class="bg-red-600 hover:bg-red-700 text-white font-bold py-1.5 px-3 rounded-lg text-xs transition">
          🔥 Ir a ZetaMods
        </a>
        <a href="admin.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-1.5 px-3 rounded-lg text-xs border border-gray-700 transition">
          ⚙️ Admin
        </a>
      </div>
    </div>
  </header>

  <!-- Banner Promocional -->
  <div class="bg-gradient-to-r from-purple-950 via-indigo-950 to-gray-900 py-2.5 px-4 text-center border-b border-indigo-900/50">
    <p class="text-xs sm:text-sm font-medium text-indigo-200">
      🎮 ¿Te gustan estos clips? 
      <a href="https://shadowscans01.github.io/zetamods/" target="_blank" class="underline text-yellow-400 font-bold ml-1 hover:text-yellow-300">
        Descarga los juegos originales en ZetaMods →
      </a>
    </p>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <!-- Adsterra Banner -->
    <div class="mb-6 flex justify-center">
      <div id="container-166ce5ccdc5d7d9f0c2ab02d4b3eea35"></div>
    </div>

    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
      <h2 class="text-xl font-bold text-gray-100">Catálogo de Videos Cortos</h2>
      <button onclick="playRandomVideo()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition shadow-md">
        🎲 Clip Aleatorio
      </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="video-grid"></div>
  </main>

  <!-- Modal para Reproducción -->
  <div id="video-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
    <div class="relative w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl">
      <button onclick="closeModal()" class="absolute top-3 right-3 z-10 bg-black/70 hover:bg-black text-white px-3 py-1 rounded-full text-xs font-bold transition">✕ Cerrar</button>
      
      <div id="modal-player-container" class="relative w-full aspect-video bg-black flex items-center justify-center"></div>

      <div class="p-4 flex flex-col gap-2">
        <h3 id="modal-title" class="font-bold text-sm text-gray-100"></h3>
        <div id="modal-action-link"></div>
      </div>
    </div>
  </div>

  <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-xs text-gray-500 mt-10">
    ZetaStream • Conectado con ZetaMods
  </footer>

  <!-- Scripts Adsterra -->
  <script data-cfasync="false" src="https://accountut.com/1/474775ac327d1e2b4275048e104254bf"></script>
  <script async="async" data-cfasync="false" src="https://bellnewyork.org/21/166ce5ccdc5d7d9f0c2ab02d4b3eea35"></script>
  <script data-cfasync="false" src="https://bellnewyork.org/14/3446817840e8c75a9ab9d6afd6a9eca5"></script>

  <script>
    const SUPABASE_URL = 'https://uefzzdrhuxwjqlkeznlv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ynlCzqEIU9s7HXksw71Nag_SMaXNnEA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allVideos = [];

    async function fetchVideos() {
      const { data, error } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
      if (error) {
        console.error('Error al cargar datos:', error);
        return;
      }
      allVideos = data || [];
      renderVideos(allVideos);
    }

    function renderVideos(videos) {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';
      if (videos.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No hay videos guardados aún.</p>';
        return;
      }

      videos.forEach(vid => {
        const card = document.createElement('div');
        card.className = 'bg-gray-900 border border-gray-800 rounded-xl overflow-hidden hover:border-red-500 transition cursor-pointer flex flex-col group shadow-lg';
        card.onclick = () => openModal(vid);

        const url = vid.video_url || '';
        let thumbnailHTML = `<div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white font-bold shadow-lg group-hover:scale-110 transition">▶</div>`;
        
        // Si es un archivo mp4 directo, usamos una miniatura visual del video automáticamente
        if (url.includes('.mp4') || url.includes('.webm')) {
          thumbnailHTML = `<video class="w-full h-full object-cover pointer-events-none opacity-80 group-hover:opacity-100 transition" preload="metadata" src="${url}#t=1"></video>
                           <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/10 transition">
                             <div class="w-10 h-10 bg-red-600/90 rounded-full flex items-center justify-center text-white font-bold shadow-lg group-hover:scale-110 transition">▶</div>
                           </div>`;
        }

        card.innerHTML = `
          <div class="relative w-full aspect-video bg-gray-950 flex items-center justify-center overflow-hidden">
            ${thumbnailHTML}
          </div>
          <div class="p-3 flex flex-col justify-between flex-grow">
            <h4 class="font-bold text-xs text-gray-200 line-clamp-2 group-hover:text-red-400 transition">${vid.title}</h4>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(vid) {
      const container = document.getElementById('modal-player-container');
      document.getElementById('modal-title').innerText = vid.title;

      const url = vid.video_url || '';
      if (url.includes('.mp4') || url.includes('.webm')) {
        container.innerHTML = `<video class="w-full h-full object-contain" controls autoplay src="${url}"></video>`;
      } else {
        container.innerHTML = `<iframe class="w-full h-full" src="${url}" frameborder="0" allowfullscreen></iframe>`;
      }

      const actionDiv = document.getElementById('modal-action-link');
      if (vid.zetamods_link && vid.zetamods_link.trim() !== '') {
        actionDiv.innerHTML = `
          <a href="${vid.zetamods_link}" target="_blank" class="inline-block bg-yellow-500 hover:bg-yellow-600 text-black font-bold text-xs px-3 py-1.5 rounded-lg transition">
            🎮 Ir al juego en ZetaMods →
          </a>
        `;
      } else {
        actionDiv.innerHTML = '';
      }

      document.getElementById('video-modal').classList.remove('hidden');
    }

    function closeModal() {
      const container = document.getElementById('modal-player-container');
      container.innerHTML = '';
      document.getElementById('video-modal').classList.add('hidden');
    }

    function playRandomVideo() {
      if (allVideos.length === 0) return;
      const randomIndex = Math.floor(Math.random() * allVideos.length);
      openModal(allVideos[randomIndex]);
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allVideos.filter(v => v.title.toLowerCase().includes(term));
      renderVideos(filtered);
    });

    fetchVideos();
  </script>
</body>
</html>
