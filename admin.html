<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaStream - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Modal de Autenticación -->
  <div id="auth-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl text-center">
      <h3 class="text-lg font-bold mb-2">Acceso Admin</h3>
      <p class="text-xs text-gray-400 mb-4">Ingresa la contraseña para gestionar contenido.</p>
      
      <form onsubmit="checkPassword(event)" class="space-y-4">
        <input type="password" id="admin-pass" required placeholder="Contraseña..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg text-sm transition">Entrar</button>
      </form>
    </div>
  </div>

  <header class="bg-gray-900 border-b border-gray-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold text-red-500">⚙️ Panel de Administración - ZetaStream</h1>
      <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-gray-700 transition">← Volver al Sitio</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Formulario para Subir Video Permanente -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl mb-8">
      <h2 class="text-base font-bold mb-4 text-gray-200">➕ Subir Video Permanente a Supabase</h2>
      
      <form id="add-video-form" onsubmit="uploadVideoFile(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Título del Video</label>
          <input type="text" id="title" required placeholder="Ej. Animación 3D Destacada" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Seleccionar Archivo de Video (.mp4 desde tu PC)</label>
          <input type="file" id="video-file" accept="video/mp4,video/webm" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-700">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Enlace a ZetaMods (Opcional)</label>
          <input type="url" id="zetamods_link" placeholder="https://shadowscans01.github.io/zetamods/..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
          Subir y Publicar Video Permanente
        </button>
      </form>
    </div>

    <!-- Lista de Videos -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
      <h2 class="text-base font-bold mb-4 text-gray-200">📋 Videos Registrados</h2>
      <div id="admin-video-list" class="space-y-3"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://uefzzdrhuxwjqlkeznlv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ynlCzqEIU9s7HXksw71Nag_SMaXNnEA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_PASSWORD = 'admin123';

    function checkPassword(e) {
      if (e) e.preventDefault();
      const inputPass = document.getElementById('admin-pass').value;
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('auth-modal').style.display = 'none';
        loadAdminVideos();
      } else {
        alert('Contraseña incorrecta');
      }
    }

    async function loadAdminVideos() {
      const listContainer = document.getElementById('admin-video-list');
      listContainer.innerHTML = '<p class="text-gray-500 text-xs">Cargando lista...</p>';

      const { data, error } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
      if (error) {
        listContainer.innerHTML = `<p class="text-red-500 text-xs">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        listContainer.innerHTML = '<p class="text-gray-500 text-xs">No hay videos guardados aún.</p>';
        return;
      }

      listContainer.innerHTML = '';
      data.forEach(vid => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-gray-800/50 border border-gray-700/50 p-3 rounded-xl gap-4';
        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-10 h-10 bg-red-950 text-red-400 border border-red-800 rounded-lg flex items-center justify-center font-bold text-xs flex-shrink-0">▶</div>
            <div class="truncate">
              <h4 class="text-xs font-bold truncate text-gray-200">${vid.title}</h4>
              <p class="text-[10px] text-gray-500 truncate">${vid.video_url}</p>
            </div>
          </div>
          <button onclick="deleteVideo(${vid.id})" class="bg-red-950/80 hover:bg-red-900 text-red-400 border border-red-800 text-xs px-3 py-1.5 rounded-lg transition flex-shrink-0">
            Eliminar
          </button>
        `;
        listContainer.appendChild(item);
      });
    }

    async function uploadVideoFile(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const fileInput = document.getElementById('video-file');
      const title = document.getElementById('title').value;
      const zetamods_link = document.getElementById('zetamods_link').value;

      if (fileInput.files.length === 0) {
        alert('Por favor selecciona un archivo de video.');
        return;
      }

      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;

      btn.disabled = true;
      btn.innerText = 'Subiendo video a Supabase...';

      // 1. Subir archivo al Storage de Supabase en el bucket 'videos'
      const { data: uploadData, error: uploadError } = await supabaseClient.storage
        .from('videos')
        .upload(fileName, file);

      if (uploadError) {
        btn.disabled = false;
        btn.innerText = 'Subir y Publicar Video Permanente';
        alert('Error al subir el archivo al Storage: ' + uploadError.message);
        return;
      }

      // 2. Obtener la URL pública permanente del archivo recién subido
      const { data: publicUrlData } = supabaseClient.storage
        .from('videos')
        .getPublicUrl(fileName);

      const video_url = publicUrlData.publicUrl;

      // 3. Guardar el registro completo en la tabla 'videos'
      const { error: dbError } = await supabaseClient.from('videos').insert([{ 
        title: title, 
        video_url: video_url, 
        zetamods_link: zetamods_link 
      }]);

      btn.disabled = false;
      btn.innerText = 'Subir y Publicar Video Permanente';

      if (dbError) {
        alert('Error al guardar en la base de datos: ' + dbError.message);
      } else {
        alert('¡Video subido y publicado permanentemente con éxito!');
        document.getElementById('add-video-form').reset();
        await loadAdminVideos();
      }
    }

    async function deleteVideo(id) {
      if (!confirm('¿Estás seguro de eliminar este video?')) return;
      const { error } = await supabaseClient.from('videos').delete().eq('id', id);
      if (error) {
        alert('Error al eliminar: ' + error.message);
      } else {
        loadAdminVideos();
      }
    }
  </script>
</body>
</html>
