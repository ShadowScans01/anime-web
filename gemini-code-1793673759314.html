<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaStream - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Modal de Autenticación -->
  <div id="auth-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl text-center">
      <h3 class="text-lg font-bold mb-2">Acceso Admin</h3>
      <p class="text-xs text-gray-400 mb-4">Ingresa la contraseña para gestionar contenido.</p>
      <input type="password" id="admin-pass" placeholder="Contraseña..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:border-red-500">
      <button onclick="checkPassword()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg text-sm transition">Entrar</button>
    </div>
  </div>

  <!-- Navbar -->
  <header class="bg-gray-900 border-b border-gray-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold text-red-500">⚙️ Panel de Administración - ZetaStream</h1>
      <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-gray-700 transition">← Volver al Sitio</a>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- Formulario para Agregar Video -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl mb-8">
      <h2 class="text-base font-bold mb-4 text-gray-200">➕ Agregar Nuevo Video</h2>
      
      <form id="add-video-form" onsubmit="uploadVideo(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Título del Video</label>
          <input type="text" id="title" required placeholder="Ej. Título del video corto" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">URL del Video (Iframe / Embed / MP4)</label>
          <input type="url" id="video_url" required placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Enlace a ZetaMods (Opcional)</label>
          <input type="url" id="zetamods_link" placeholder="https://shadowscans01.github.io/zetamods/..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
        </div>

        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
          Guardar y Publicar Video
        </button>
      </form>
    </div>

    <!-- Lista de Videos -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
      <h2 class="text-base font-bold mb-4 text-gray-200">📋 Videos Registrados</h2>
      <div id="admin-video-list" class="space-y-3"></div>
    </div>
  </main>

  <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-xs text-gray-500 mt-10">
    ZetaStream Admin
  </footer>

  <script>
    const SUPABASE_URL = 'https://uefzzdrhuxwjqlkeznlv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ynlCzqEIU9s7HXksw71Nag_SMaXNnEA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ADMIN_PASSWORD = 'admin123';

    function checkPassword() {
      const inputPass = document.getElementById('admin-pass').value;
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('auth-modal').style.display = 'none';
        loadAdminVideos();
      } else {
        alert('Contraseña incorrecta');
      }
    }

    document.getElementById('admin-pass').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    async function loadAdminVideos() {
      const listContainer = document.getElementById('admin-video-list');
      listContainer.innerHTML = '<p class="text-gray-500 text-xs">Cargando lista...</p>';

      const { data, error } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
      if (error) {
        listContainer.innerHTML = `<p class="text-red-500 text-xs">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        listContainer.innerHTML = '<p class="text-gray-500 text-xs">No hay videos guardados aún.</p>';
        return;
      }

      listContainer.innerHTML = '';
      data.forEach(vid => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-gray-800/50 border border-gray-700/50 p-3 rounded-xl gap-4';
        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-10 h-10 bg-red-950 text-red-400 border border-red-800 rounded-lg flex items-center justify-center font-bold text-xs flex-shrink-0">▶</div>
            <div class="truncate">
              <h4 class="text-xs font-bold truncate text-gray-200">${vid.title}</h4>
              <p class="text-[10px] text-gray-500 truncate">${vid.video_url}</p>
            </div>
          </div>
          <button onclick="deleteVideo(${vid.id})" class="bg-red-950/80 hover:bg-red-900 text-red-400 border border-red-800 text-xs px-3 py-1.5 rounded-lg transition flex-shrink-0">
            Eliminar
          </button>
        `;
        listContainer.appendChild(item);
      });
    }

    async function uploadVideo(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const video_url = document.getElementById('video_url').value;
      const zetamods_link = document.getElementById('zetamods_link').value;

      const { error } = await supabaseClient.from('videos').insert([{ 
        title, 
        video_url, 
        zetamods_link 
      }]);

      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        alert('¡Video publicado con éxito!');
        document.getElementById('add-video-form').reset();
        loadAdminVideos();
      }
    }

    async function deleteVideo(id) {
      if (!confirm('¿Estás seguro de eliminar este video?')) return;
      const { error } = await supabaseClient.from('videos').delete().eq('id', id);
      if (error) {
        alert('Error al eliminar: ' + error.message);
      } else {
        loadAdminVideos();
      }
    }
  </script>
</body>
</html>
