<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaStream - Videos Permanentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-extrabold text-red-500 tracking-wider">🎥 ZetaStream</h1>
        <span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-semibold">Permanente</span>
      </div>

      <!-- Buscador y Enlace Admin -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <input type="text" id="search-input" oninput="filterVideos()" placeholder="Buscar video..." class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-red-500 w-full sm:w-48">
        <a href="admin.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-1.5 rounded-xl border border-gray-700 transition flex-shrink-0">⚙️ Admin</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="mb-6 flex justify-between items-center">
      <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Catálogo de Videos</h2>
      <span id="video-count" class="text-xs text-gray-500">Cargando...</span>
    </div>

    <!-- Grid de Videos -->
    <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Los videos se cargan dinámicamente aquí -->
    </div>

    <!-- Paginación Numérica (Estilo de la imagen) -->
    <div id="pagination-container" class="flex flex-wrap items-center justify-center gap-1.5 mt-10">
      <!-- Se genera por JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-xs text-gray-500">
    ZetaStream &copy; 2026 - Conectado con Supabase & ZetaMods
  </footer>

  <script>
    const SUPABASE_URL = 'https://uefzzdrhuxwjqlkeznlv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ynlCzqEIU9s7HXksw71Nag_SMaXNnEA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allVideos = [];
    let currentPage = 1;
    const itemsPerPage = 12; // Cantidad de videos por página

    async function loadPublicVideos() {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '<p class="text-gray-500 text-xs col-span-full text-center py-10">Cargando videos...</p>';

      const { data, error } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
      
      if (error) {
        grid.innerHTML = `<p class="text-red-500 text-xs col-span-full text-center">Error al cargar: ${error.message}</p>`;
        return;
      }

      allVideos = data || document.getElementById('video-count').innerText = `${allVideos.length} videos`;
      renderVideos();
    }

    function renderVideos() {
      const grid = document.getElementById('video-grid');
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      
      const filtered = allVideos.filter(v => v.title.toLowerCase().includes(searchVal));
      document.getElementById('video-count').innerText = `${filtered.length} videos encontrados`;

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 text-xs col-span-full text-center py-10">No se encontraron videos.</p>';
        document.getElementById('pagination-container').innerHTML = '';
        return;
      }

      // Paginación lógica
      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      if (currentPage > totalPages) currentPage = 1;

      const start = (currentPage - 1) * itemsPerPage;
      const paginatedVideos = filtered.slice(start, start + itemsPerPage);

      grid.innerHTML = '';
      paginatedVideos.forEach(vid => {
        const card = document.createElement('div');
        card.className = 'bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg hover:border-gray-700 transition flex flex-col justify-between';
        
        card.innerHTML = `
          <div>
            <div class="aspect-video bg-black relative">
              <video src="${vid.video_url}#t=1" preload="metadata" controls class="w-full h-full object-cover"></video>
            </div>
            <div class="p-3">
              <h3 class="text-xs font-bold text-gray-200 line-clamp-2">${vid.title}</h3>
            </div>
          </div>
          ${vid.zetamods_link ? `
            <div class="p-3 pt-0">
              <a href="${vid.zetamods_link}" target="_blank" class="block w-full bg-gray-800 hover:bg-gray-700 text-red-400 border border-gray-700 text-center text-[11px] font-semibold py-1.5 rounded-xl transition">
                🔗 Ver en ZetaMods
              </a>
            </div>
          ` : ''}
        `;
        grid.appendChild(card);
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('pagination-container');
      container.innerHTML = '';

      if (totalPages <= 1) return;

      // Botón Anterior
      const prevBtn = document.createElement('button');
      prevBtn.innerHTML = '◀ Anterior';
      prevBtn.className = `px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${currentPage === 1 ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' : 'bg-gray-900 hover:bg-gray-800 text-gray-300 border-gray-700'}`;
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderVideos(); } };
      container.appendChild(prevBtn);

      // Botones Numéricos
      for (let i = 1; i <= totalPages; i++) {
        const numBtn = document.createElement('button');
        numBtn.innerText = i;
        numBtn.className = `px-3.5 py-1.5 rounded-xl text-xs font-bold border transition ${i === currentPage ? 'bg-indigo-600 text-white border-indigo-500 shadow-md' : 'bg-gray-900 hover:bg-gray-800 text-gray-300 border-gray-700'}`;
        numBtn.onclick = () => { currentPage = i; renderVideos(); };
        container.appendChild(numBtn);
      }

      // Botón Próximo
      const nextBtn = document.createElement('button');
      nextBtn.innerHTML = 'Próximo ▶';
      nextBtn.className = `px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${currentPage === totalPages ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' : 'bg-gray-900 hover:bg-gray-800 text-gray-300 border-gray-700'}`;
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderVideos(); } };
      container.appendChild(nextBtn);
    }

    function filterVideos() {
      currentPage = 1;
      renderVideos();
    }

    loadPublicVideos();
  </script>
</body>
</html>
