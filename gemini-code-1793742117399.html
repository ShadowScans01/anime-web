<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaStream - Videos Permanentes (+18)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Modal de Verificación de Edad (+18) -->
  <div id="age-modal" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl text-center">
      <div class="text-3xl mb-2">🔞</div>
      <h3 class="text-lg font-bold mb-2 text-white">Contenido para Adultos (+18)</h3>
      <p class="text-xs text-gray-400 mb-6">Este sitio web contiene material exclusivo para mayores de edad. ¿Confirmas que tienes 18 años o más?</p>
      <div class="flex gap-3">
        <button onclick="denyAge()" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-2.5 rounded-xl text-xs transition border border-gray-700">No, salir</button>
        <button onclick="acceptAge()" class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">Sí, soy mayor</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-extrabold text-red-500 tracking-wider">🎥 ZetaStream</h1>
        <span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-semibold">+18 Permanente</span>
      </div>

      <!-- Buscador y Enlace Admin -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <input type="text" id="search-input" oninput="filterVideos()" placeholder="Buscar video..." class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-red-500 w-full sm:w-48">
        <a href="admin.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-1.5 rounded-xl border border-gray-700 transition flex-shrink-0">⚙️ Admin</a>
      </div>
    </div>
  </header>

  <!-- 💰 ANUNCIO 1: NATIVO (bellnewyork.org/21) -->
  <div class="max-w-7xl mx-auto px-4 pt-4 w-full flex justify-center items-center overflow-hidden">
    <div id="container-166ce5ccdc5d7d9f0c2ab02d4b3eea35"></div>
    <script async="async" data-cfasync="false" src="https://bellnewyork.org/21/166ce5ccdc5d7d9f0c2ab02d4b3eea35"></script>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <div class="mb-6 flex justify-between items-center">
      <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Catálogo de Videos</h2>
      <span id="video-count" class="text-xs text-gray-500">Cargando...</span>
    </div>

    <!-- Grid de Videos -->
    <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <p class="text-gray-500 text-xs col-span-full text-center py-10">Cargando videos...</p>
    </div>

    <!-- 💰 ANUNCIO 2: BANNER (bellnewyork.org/14) -->
    <div class="my-6 flex justify-center items-center overflow-hidden w-full">
      <script data-cfasync="false" src="https://bellnewyork.org/14/3446817840e8c75a9ab9d6afd6a9eca5"></script>
    </div>

    <!-- Paginación Numérica -->
    <div id="pagination-container" class="flex flex-wrap items-center justify-center gap-1.5 mt-6"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-xs text-gray-500">
    ZetaStream &copy; 2026 - Conectado con Supabase & ZetaMods
  </footer>

  <script>
    const SUPABASE_URL = 'https://uefzzdrhuxwjqlkeznlv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ynlCzqEIU9s7HXksw71Nag_SMaXNnEA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allVideos = [];
    let currentPage = 1;
    const itemsPerPage = 12;

    // Verificar si ya confirmó la edad al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      const verified = localStorage.getItem('zeta_age_verified');
      if (verified !== 'true') {
        document.getElementById('age-modal').classList.remove('hidden');
      } else {
        loadPublicVideos();
      }
    });

    function acceptAge() {
      localStorage.setItem('zeta_age_verified', 'true');
      document.getElementById('age-modal').classList.add('hidden');
      loadPublicVideos();
    }

    function denyAge() {
      alert('Debes ser mayor de 18 años para acceder a este sitio.');
      window.location.href = 'https://www.google.com';
    }

    // Función para evitar vulnerabilidades XSS
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function loadPublicVideos() {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '<p class="text-gray-500 text-xs col-span-full text-center py-10">Cargando videos...</p>';

      const { data, error } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
      
      if (error) {
        grid.innerHTML = `<p class="text-red-500 text-xs col-span-full text-center">Error al cargar datos: ${escapeHtml(error.message)}</p>`;
        document.getElementById('video-count').innerText = '0 videos';
        return;
      }

      allVideos = data || [];
      renderVideos();
    }

    function renderVideos() {
      const grid = document.getElementById('video-grid');
      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
      
      const filtered = allVideos.filter(v => v.title && v.title.toLowerCase().includes(searchVal));
      document.getElementById('video-count').innerText = `${filtered.length} videos`;

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 text-xs col-span-full text-center py-10">No se encontraron videos disponibles.</p>';
        document.getElementById('pagination-container').innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      if (currentPage > totalPages) currentPage = 1;

      const start = (currentPage - 1) * itemsPerPage;
      const paginatedVideos = filtered.slice(start, start + itemsPerPage);

      grid.innerHTML = '';
      paginatedVideos.forEach(vid => {
        const card = document.createElement('div');
        card.className = 'bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg hover:border-gray-700 transition flex flex-col justify-between';
        
        const safeTitle = escapeHtml(vid.title);
        const safeVideoUrl = escapeHtml(vid.video_url);
        const safeZetaModsLink = escapeHtml(vid.zetamods_link);

        card.innerHTML = `
          <div>
            <div class="aspect-video bg-black relative">
              <video src="${safeVideoUrl}#t=1" preload="metadata" controls class="w-full h-full object-cover"></video>
            </div>
            <div class="p-3">
              <h3 class="text-xs font-bold text-gray-200 line-clamp-2">${safeTitle}</h3>
            </div>
          </div>
          ${safeZetaModsLink ? `
            <div class="p-3 pt-0">
              <a href="${safeZetaModsLink}" target="_blank" rel="noopener noreferrer" class="block w-full bg-gray-800 hover:bg-gray-700 text-red-400 border border-gray-700 text-center text-[11px] font-semibold py-1.5 rounded-xl transition">
                🔗 Ver en ZetaMods
              </a>
            </div>
          ` : ''}
        `;
        grid.appendChild(card);
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('pagination-container');
      container.innerHTML = '';

      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.innerText = '◀ Anterior';
      prevBtn.className = `px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${currentPage === 1 ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' : 'bg-gray-900 hover:bg-gray-800 text-gray-300 border-gray-700'}`;
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderVideos(); } };
      container.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const numBtn = document.createElement('button');
        numBtn.innerText = i;
        numBtn.className = `px-3.5 py-1.5 rounded-xl text-xs font-bold border transition ${i === currentPage ? 'bg-indigo-600 text-white border-indigo-500 shadow-md' : 'bg-gray-900 hover:bg-gray-800 text-gray-300 border-gray-700'}`;
        numBtn.onclick = () => { currentPage = i; renderVideos(); };
        container.appendChild(numBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.innerText = 'Próximo ▶';
      nextBtn.className = `px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${currentPage === totalPages ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' : 'bg-gray-900 hover:bg-gray-800 text-gray-300 border-gray-700'}`;
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderVideos(); } };
      container.appendChild(nextBtn);
    }

    function filterVideos() {
      currentPage = 1;
      renderVideos();
    }
  </script>

  <!-- 💰 ANUNCIO 3: POPUNDER EMERGENTE (accountut.com) -->
  <script data-cfasync="false" src="https://accountut.com/1/474775ac327d1e2b4275048e104254bf"></script>

</body>
</html>
